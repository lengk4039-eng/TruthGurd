services:
  db:
    image: postgres:16-alpine
    container_name: trustguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustguard
      POSTGRES_USER: trustguard
      POSTGRES_PASSWORD: trustguard
    ports:
      - "5432:5432"
    volumes:
      - trustguard_pg_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustguard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trustguard_pg_data:
