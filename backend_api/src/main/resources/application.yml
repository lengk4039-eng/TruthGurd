spring:
  application:
    name: insurance-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trustguard}
    username: ${DB_USERNAME:trustguard}
    password: ${DB_PASSWORD:trustguard}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8081}
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:this-is-a-demo-secret-key-change-it-before-any-production-use-32bytes-min}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 2592000000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.trustguard.insurance: INFO
